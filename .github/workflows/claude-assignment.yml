name: Claude VAT Implementation

# PREREQUISITES - this workflow will silently fail without these:
# 1. Secret: Add ANTHROPIC_API_KEY to your repository secrets
#    (Settings → Secrets and variables → Actions → New repository secret)
# 2. GitHub App: Install the Claude GitHub App AND link it to your Anthropic account:
#    a. Install the app on your repo: https://github.com/apps/claude
#    b. Connect it to your Anthropic account: https://claude.ai/settings → GitHub
#    Both steps are required — doing only one will cause OIDC token exchange to fail.
# 3. Trigger: New VAT issues start automatically. Later @claude comments
#    on that issue or its PR continue the work.

on:
  workflow_dispatch:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude-vat:
    if: >
      (github.event_name == 'issues' &&
       contains(github.event.issue.body, 'Template: VAT')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.claude.outputs.branch_name }}
      pr_number: ${{ steps.verify-tool-pr.outputs.pr_number }}
      tool_path: ${{ steps.verify-tool-pr.outputs.tool_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assign issue creator
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Read current issue or PR body
        id: issue-body
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const response = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            });
            return response.data.body || "";

      - name: Ask Claude to implement the VAT issue
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: claude/issue-${{ github.event.issue.number }}-
          track_progress: true
          prompt: |
            Repository: ${{ github.repository }}
            Issue or PR number: #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}
            Body:
            ${{ steps.issue-body.outputs.result }}
            Latest request comment:
            ${{ github.event.comment.body }}

            Read the issue or PR title, body, latest request comment, and the
            repository-root `CLAUDE.md`. Follow `CLAUDE.md` as the generated-tool
            instruction source of truth. The issue body, latest request comment,
            and root `CLAUDE.md` are the authoritative requirements.
            Maintain the workflow's single existing GitHub progress comment and
            update it in place after meaningful work or decisions. Use the same
            two-level progress format in both Create and Update work:
            1. A concise end-user block at the top with one `NN% Short status`
               line followed by 2-3 short progress sentences.
            2. A detailed expert block underneath with sections such as
               `### Progress`, `### Current analysis`,
               `### Implementation decisions`, `### Recent work`, and
               `### Next step`.
            At completion, use `100% Complete`, a short end-user-facing
            completion summary, and `### Implementation summary` for the
            detailed block. Overwrite evolving sections instead of appending
            unlimited history. Summarize observable decisions, evidence,
            alternatives, uncertainty, recent work, and next actions without
            exposing hidden chain-of-thought, raw command logs, token details,
            or long internal traces.
            Before implementing any temporal or multi-frame Streaming tool,
            inspect the relevant repository runtime and existing tool patterns
            referenced by `CLAUDE.md` rather than inventing scheduling from scratch.

            Modify only the requested Python tool in `tools/` unless the public
            runtime is genuinely insufficient. Do not edit unrelated files and
            never push directly to `main`. Work on the action-created branch,
            commit the result, and push the branch for workflow-managed PR creation.
            When this run was triggered from an open PR comment, update that
            existing PR branch instead of creating another PR.

            After writing the tool, validate it before committing by running:
              cd backend && python3 validate_generated_tools.py ../tools/<tool_name>.py
            Fix any reported errors before committing or pushing.

            Model rules (enforced — do not deviate):
            - Default visual tool calls to `gemini/gemini-3.1-flash-lite`.
            - Do not use gpt-4o-mini, gpt-4, gpt-4o, or any non-Gemini model for
              visual tasks. gpt-4o-mini is text-only and has no image support.
            - `call_model` is a synchronous function. Always call it as
              `await asyncio.to_thread(call_model, model, messages, images)`.
              Never write `await call_model(...)` — that raises a TypeError at runtime.
          claude_args: '--allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(find:*),Bash(ls:*),Bash(python3:*),Bash(cd:*),Read,View,Glob,GlobTool,Grep,GrepTool,Write,Edit" --max-turns 100 --model claude-sonnet-5'
      - name: Create PR for Claude branch if needed
        if: github.event.issue.pull_request == null
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: main
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          set -euxo pipefail
      
          echo "Issue number: $ISSUE_NUMBER"
          echo "Base branch: $BASE_BRANCH"
          echo "Claude branch output: ${CLAUDE_BRANCH:-<empty>}"
      
          echo "=== Git remotes ==="
          git remote -v
      
          echo "=== Git config ==="
          git config --list | grep -E 'credential|extraheader|url' || true

          git remote set-url origin \
          "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
      
          if [ -z "${CLAUDE_BRANCH:-}" ]; then
            branch_prefix="claude/issue-${ISSUE_NUMBER}-"
            echo "Claude branch output was empty; searching for remote branches with prefix: $branch_prefix"
      
            matching_branches="$(
              git ls-remote --heads origin "refs/heads/${branch_prefix}*" \
                | awk '{sub("refs/heads/","",$2); print $2}'
            )"
      
            if [ -z "$matching_branches" ]; then
              echo "::error::No remote Claude branch found for issue #$ISSUE_NUMBER."
              exit 1
            fi
      
            CLAUDE_BRANCH="$(printf '%s\n' "$matching_branches" | tail -n 1)"
          fi
      
          echo "Detected Claude branch: $CLAUDE_BRANCH"
      
          remote_branch_sha="$(
            git ls-remote --heads origin "refs/heads/$CLAUDE_BRANCH" \
              | awk '{print $1}' \
              | head -n 1
          )"
      
          if [ -z "$remote_branch_sha" ]; then
            echo "::error::Remote branch '$CLAUDE_BRANCH' does not exist on origin."
            exit 1
          fi
      
          echo "Remote branch SHA: $remote_branch_sha"
      
          git fetch --no-tags origin "$BASE_BRANCH" "$CLAUDE_BRANCH"
      
          ahead_count="$(
            git rev-list --count "origin/${BASE_BRANCH}..origin/${CLAUDE_BRANCH}"
          )"
      
          echo "Commits ahead of ${BASE_BRANCH}: $ahead_count"
      
          if [ "$ahead_count" -eq 0 ]; then
            echo "::error::Branch '$CLAUDE_BRANCH' has no commits ahead of '$BASE_BRANCH'; refusing to open a PR."
            exit 1
          fi
      
          echo "Looking for existing open PRs for branch '$CLAUDE_BRANCH'"
      
          existing_pr_json="$(
            gh pr list \
              --state open \
              --head "$CLAUDE_BRANCH" \
              --json number,url,headRefName
          )"
      
          echo "Existing PR lookup: ${existing_pr_json:-[]}"
      
          existing_pr_url="$(
            printf '%s' "$existing_pr_json" | jq -r '.[0].url // empty'
          )"
      
          if [ -n "$existing_pr_url" ]; then
            echo "Final PR URL: $existing_pr_url"
            exit 0
          fi
      
          existing_issue_pr_url="$(
            gh pr list \
              --state open \
              --limit 100 \
              --json number,url,title,body \
              --jq ".[] | select(((.title // \"\") + \" \" + (.body // \"\")) | contains(\"#${ISSUE_NUMBER}\")) | .url" \
              | head -n 1
          )"
      
          echo "Existing issue-linked PR lookup: ${existing_issue_pr_url:-<none>}"
      
          if [ -n "$existing_issue_pr_url" ]; then
            echo "Final PR URL: $existing_issue_pr_url"
            exit 0
          fi
      
          echo "Creating PR from branch '$CLAUDE_BRANCH' to '$BASE_BRANCH'"
      
          pr_url="$(
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$CLAUDE_BRANCH" \
              --title "$ISSUE_TITLE" \
              --body "Fixes #$ISSUE_NUMBER"
          )"
      
          echo "PR creation result: $pr_url"
          echo "Final PR URL: $pr_url"

      - name: Verify a tool PR was produced
        id: verify-tool-pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
        run: |
          if [ "$IS_PULL_REQUEST" = "true" ]; then
            pr_number="$TARGET_NUMBER"
          else
            pr_number="$(gh pr list --state open --limit 100 --json number,title,body \
              --jq ".[] | select(((.title // \"\") + \" \" + (.body // \"\")) | contains(\"#$TARGET_NUMBER\")) | .number" \
              | head -n 1)"
          fi
          if [ -z "$pr_number" ]; then
            echo "::error::Claude did not create an open PR referencing issue #$TARGET_NUMBER."
            exit 1
          fi
          tool_files="$(gh pr view "$pr_number" --json files \
            --jq '.files[].path | select(startswith("tools/") and endswith(".py"))')"
          if [ -z "$tool_files" ]; then
            echo "::error::PR #$pr_number does not create or modify a Python tool in tools/."
            exit 1
          fi
          echo "Verified PR #$pr_number tool changes:"
          echo "$tool_files"
          first_tool_file="$(printf '%s\n' "$tool_files" | head -n 1)"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "tool_path=$first_tool_file" >> "$GITHUB_OUTPUT"

      # - name: Persist implementation context on Claude branch
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #     REPO: ${{ github.repository }}
      #     ISSUE_NUMBER: ${{ github.event.issue.number }}
