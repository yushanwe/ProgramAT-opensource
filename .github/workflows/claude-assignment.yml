      #     set -euxo pipefail

      #     branch_name="${CLAUDE_BRANCH:-}"
      #     if [ -z "$branch_name" ]; then
      #       branch_prefix="claude/issue-${ISSUE_NUMBER}-"
      #       branch_name="$(
      #         git ls-remote --heads origin "refs/heads/${branch_prefix}*" \
      #           | awk '{sub("refs/heads/","",$2); print $2}' \
      #           | tail -n 1
      #       )"
      #     fi

      #     if [ -z "$branch_name" ]; then
      #       echo "::error::Could not determine Claude branch for issue #$ISSUE_NUMBER."
      #       exit 1
      #     fi

      #     git fetch --no-tags origin "$branch_name"
      #     git checkout -B "$branch_name" "origin/$branch_name"

      #     commit_sha="$(git rev-parse HEAD)"
      #     pr_number="${VERIFIED_PR_NUMBER:-}"
