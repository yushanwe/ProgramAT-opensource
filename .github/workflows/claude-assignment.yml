      #     mkdir -p .programat /tmp/programat-context

      #     comments_json="/tmp/programat-context/comments.json"
      #     pr_files_json="/tmp/programat-context/pr_files.json"
      #     raw_log_file="/tmp/programat-context/raw_action_log.txt"
      #     jobs_json="/tmp/programat-context/jobs.json"

      #     gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "$comments_json"
      #     gh api "repos/${REPO}/pulls/${pr_number}/files?per_page=100" > "$pr_files_json"
      #     gh api "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100" > "$jobs_json"

      #     workflow_job_id="$(jq -r '.jobs[] | select(.name == "claude-vat") | .id' "$jobs_json" | head -n 1)"
      #     workflow_job_url=""
      #     if [ -n "${workflow_job_id:-}" ] && [ "$workflow_job_id" != "null" ]; then
